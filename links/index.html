<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Links úteis · Ferramentas</title>
<meta name="description" content="Atalhos para os sites e serviços online mais usados no dia a dia, incluindo a impressão de ART do CREA-ES pelo número.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/comum.css">
<script src="../assets/comum.js"></script>
<style>
/* Só o que é específico desta ferramenta. */
main.wrap { padding-top: 24px; display: grid; gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
.panel h2 { margin: 0 0 12px; font-size: 16px; }
.panel p { margin: 0 0 12px; }

/* Consulta de ART */
.art-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.art-form .campo { display: grid; gap: 6px; flex: 1 1 240px; max-width: 360px; }
.art-form label { font-size: 14px; font-weight: 500; }
.art-form input {
  font: inherit; font-family: 'JetBrains Mono', ui-monospace, monospace;
  padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink); width: 100%; box-sizing: border-box;
}
.art-form input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.art-msg { min-height: 1.4em; margin: 10px 0 0; font-size: 14px; }
.art-msg.erro { color: #b42318; }
@media (prefers-color-scheme: dark) { .art-msg.erro { color: #f97066; } }
.art-url { margin: 10px 0 0; font-size: 12px; opacity: .65; font-family: 'JetBrains Mono', ui-monospace, monospace; word-break: break-all; }

/* Lista de links */
.grupo h2 { margin-bottom: 4px; }
.links { list-style: none; margin: 0; padding: 0; }
.links li { border-top: 1px solid var(--line); }
.links li:first-child { border-top: 0; }
.links a {
  display: grid; gap: 2px; padding: 12px 4px; text-decoration: none; color: inherit;
}
.links a:hover .nome, .links a:focus-visible .nome { color: var(--accent); text-decoration: underline; }
.links a:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-radius: 4px; }
.links .nome { font-weight: 600; }
.links .desc { font-size: 14px; opacity: .72; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <nav class="crumbs" aria-label="Navegação">
      <a href="../">← Todas as ferramentas</a>
      <button type="button" class="btn light small" id="themeBtn">Tema</button>
    </nav>
    <div class="top-main">
      <div>
        <h1>Links úteis</h1>
        <p class="lead">Atalhos para os sites mais usados no trabalho. Para imprimir uma ART, digite o número e abra direto no CREA-ES.</p>
      </div>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="panel" aria-labelledby="tituloArt">
    <h2 id="tituloArt">Imprimir ART (CREA-ES)</h2>
    <p>Informe o número da ART para abrir a versão para impressão no site do CREA-ES.</p>
    <div class="art-form">
      <div class="campo">
        <label for="artNumero">Número da ART</label>
        <input type="text" id="artNumero" inputmode="text" autocomplete="off" spellcheck="false" placeholder="Ex.: ES20260000000">
      </div>
      <button class="btn primary" type="button" id="artAbrir">Abrir ART</button>
      <button class="btn ghost" type="button" id="artCopiar">Copiar link</button>
    </div>
    <p class="art-msg" id="artMsg" role="status" aria-live="polite"></p>
    <p class="art-url" id="artUrl" hidden></p>
  </section>

  <div id="grupos"></div>

</main>

<footer class="site-foot wrap">
  <a href="../">← Voltar para todas as ferramentas</a>
</footer>

<script>
/* ---------- Edite aqui: grupos e links ---------- */
var GRUPOS = [
  {
    titulo: 'Georreferenciamento e registro',
    links: [
      { nome: 'SIGEF – INCRA', url: 'https://sigef.incra.gov.br/', desc: 'Sistema de Gestão Fundiária: consulta e certificação de parcelas.' },
      { nome: 'INCRA', url: 'https://www.gov.br/incra/pt-br', desc: 'Portal do Instituto Nacional de Colonização e Reforma Agrária.' },
      { nome: 'CAR – Cadastro Ambiental Rural', url: 'https://www.car.gov.br/', desc: 'Consulta e acompanhamento do recibo de inscrição no CAR.' },
      { nome: 'ONR – Operador Nacional do Registro', url: 'https://www.onr.org.br/', desc: 'Serviços eletrônicos dos cartórios de Registro de Imóveis.' }
    ]
  },
  {
    titulo: 'Conselhos e dados oficiais',
    links: [
      { nome: 'CREA-ES', url: 'https://www.creaes.org.br/', desc: 'Conselho Regional de Engenharia e Agronomia do Espírito Santo.' },
      { nome: 'CREA-ES – Serviços online', url: 'https://www.creaes.org.br/ServicosOnline/', desc: 'ART, certidões e demais serviços para profissionais.' },
      { nome: 'Confea', url: 'https://www.confea.org.br/', desc: 'Conselho Federal de Engenharia e Agronomia.' },
      { nome: 'IBGE', url: 'https://www.ibge.gov.br/', desc: 'Dados geodésicos, cartográficos e estatísticos.' }
    ]
  }
];

/* ---------- Renderização dos grupos ---------- */
(function () {
  var raiz = document.getElementById('grupos');
  GRUPOS.forEach(function (g) {
    var sec = document.createElement('section');
    sec.className = 'panel grupo';
    var h2 = document.createElement('h2');
    h2.textContent = g.titulo;
    sec.appendChild(h2);
    var ul = document.createElement('ul');
    ul.className = 'links';
    g.links.forEach(function (l) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = l.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      var nome = document.createElement('span');
      nome.className = 'nome';
      nome.textContent = l.nome;
      var desc = document.createElement('span');
      desc.className = 'desc';
      desc.textContent = l.desc;
      a.appendChild(nome);
      a.appendChild(desc);
      li.appendChild(a);
      ul.appendChild(li);
    });
    sec.appendChild(ul);
    raiz.appendChild(sec);
  });
})();

/* ---------- Impressão de ART ---------- */
var ART_BASE = 'https://www.creaes.org.br/ServicosOnline/pgImprimirART.aspx?ART=';
var campo = document.getElementById('artNumero');
var msg = document.getElementById('artMsg');
var urlBox = document.getElementById('artUrl');

function montarUrl() {
  var numero = campo.value.trim().replace(/\s+/g, '');
  if (!numero) {
    msg.textContent = 'Digite o número da ART.';
    msg.className = 'art-msg erro';
    urlBox.hidden = true;
    campo.focus();
    return null;
  }
  msg.textContent = '';
  msg.className = 'art-msg';
  var url = ART_BASE + encodeURIComponent(numero);
  urlBox.textContent = url;
  urlBox.hidden = false;
  return url;
}

document.getElementById('artAbrir').addEventListener('click', function () {
  var url = montarUrl();
  if (url) { window.open(url, '_blank', 'noopener,noreferrer'); }
});

campo.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { document.getElementById('artAbrir').click(); }
});

document.getElementById('artCopiar').addEventListener('click', function () {
  var url = montarUrl();
  if (!url) { return; }
  function ok() { msg.textContent = 'Link copiado.'; }
  function falha() { msg.textContent = 'Não foi possível copiar. Selecione o link abaixo e copie manualmente.'; msg.className = 'art-msg erro'; }
  try {
    navigator.clipboard.writeText(url).then(ok, falha);
  } catch (e) { falha(); }
});
</script>
</body>
</html>
